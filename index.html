<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acortador Leyjam</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <h1>Acortador Leyjam</h1>
    <input id="longUrl" type="text" placeholder="Pega aquí el link largo">
    <input id="alias" type="text" placeholder="Pon tu alias">
    <button onclick="acortar()">Acortar</button>
    <div id="resultado"></div>
  </div>

<script>
async function acortar() {
  const longUrl = document.getElementById("longUrl").value.trim();
  const alias = document.getElementById("alias").value.trim();
  if (!longUrl || !alias) { alert("Debes poner link y alias"); return; }

  // Cargar links existentes
  const response = await fetch('links.json');
  const links = await response.json();

  if (links[alias]) { alert("Este alias ya existe"); return; }

  // Guardar nuevo link (actualizar JSON manualmente después en GitHub)
  links[alias] = longUrl;
  // Nota: GitHub Pages no permite modificar JSON directo desde el navegador
  // Para actualizar nuevos links, subes links.json modificado al repositorio

  const shortLink = `https://leyjam.github.io/redirect.html?alias=${encodeURIComponent(alias)}`;
  document.getElementById("resultado").innerHTML = `<a href="${shortLink}" target="_blank">${shortLink}</a>`;
}
</script>
</body>
</html>
