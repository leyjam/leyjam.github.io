<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acortador Leyjam</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    input, button { padding: 10px; margin: 10px; width: 300px; }
    a { display: block; margin-top: 20px; color: blue; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Acortador Leyjam</h1>
  <input id="longUrl" type="text" placeholder="Pega aquí el link largo">
  <br>
  <input id="alias" type="text" placeholder="Pon aquí tu alias">
  <br>
  <button onclick="acortar()">Acortar</button>
  <div id="resultado"></div>

  <script>
    function acortar() {
      const siteDomain = "https://leyjam.github.io"; // tu dominio de GitHub Pages
      const longUrl = document.getElementById("longUrl").value.trim();
      const alias = document.getElementById("alias").value.trim();

      if(!longUrl) { alert("Debes poner un link"); return; }

      const shortLink = `${siteDomain}/redirect.html?u=${encodeURIComponent(longUrl)}&alias=${encodeURIComponent(alias)}`;

      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = `<a href="${shortLink}" target="_blank">${shortLink}</a>`;
    }
  </script>
</body>
</html>
