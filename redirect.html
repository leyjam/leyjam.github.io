<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo...</title>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get("u");
      if(url) {
        window.location.href = url; // redirige directo al link original
      } else {
        document.body.innerHTML = "<h2>No se encontró ningún link para redirigir.</h2>";
      }
    };
  </script>
</head>
<body>
  <h2>Redirigiendo...</h2>
</body>
</html>
